<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220" viewBox="0 0 220 220">
  <defs>
    <!-- Sitenin Resmi Renk Paleti: Cyan -> Indigo -->
    <linearGradient id="centeredDGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop class="logo-grad-1" offset="0%" stop-color="#38bdf8" />
      <stop class="logo-grad-2" offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <filter id="perfectGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      /* Koyu / Obsidian Teması (Sitenin Resmi Paleti) */
      .logo-bg { fill: #0b0f19; stroke: rgba(56, 189, 248, 0.15); stroke-width: 1px; }
      .logo-body { fill: #131b2e; }
      .logo-wire { stroke: #38bdf8; }
      .logo-node { fill: #38bdf8; }
      .logo-grad-1 { stop-color: #38bdf8; }
      .logo-grad-2 { stop-color: #6366f1; }

      /* Açık / Pastel Teması (Sitenin Pastel Paleti: #0284c7 & #4f46e5) */
      @media (prefers-color-scheme: light) {
        .logo-bg { fill: #eef2ff; stroke: #c7d2fe; stroke-width: 1.5px; }
        .logo-body { fill: #ffffff; }
        .logo-wire { stroke: #0284c7; }
        .logo-node { fill: #0284c7; }
        .logo-grad-1 { stop-color: #0284c7; }
        .logo-grad-2 { stop-color: #4f46e5; }
      }
    </style>
  </defs>

  <!-- Çip Arka Planı -->
  <rect class="logo-bg" width="220" height="220" rx="44"/>

  <!-- ==================== GİRDİ / ÇIKTI HATTLARI ==================== -->
  <!-- A Girdisi -->
  <line class="logo-wire" x1="20" y1="80" x2="58" y2="80" stroke-width="6" stroke-linecap="round"/>
  <circle class="logo-node" cx="20" cy="80" r="5"/>

  <!-- B Girdisi -->
  <line class="logo-wire" x1="20" y1="140" x2="58" y2="140" stroke-width="6" stroke-linecap="round"/>
  <circle class="logo-node" cx="20" cy="140" r="5"/>

  <!-- Y Çıktısı -->
  <line class="logo-wire" x1="172" y1="110" x2="200" y2="110" stroke-width="6" stroke-linecap="round"/>
  <circle class="logo-node" cx="200" cy="110" r="6" filter="url(#perfectGlow)"/>

  <!-- ==================== ANA BÜYÜK D HARFİ GÖVDESİ ==================== -->
  <path class="logo-body" 
        d="M 58 46 
           L 118 46 
           A 64 64 0 0 1 118 174 
           L 58 174 
           Z" 
        stroke="url(#centeredDGrad)" 
        stroke-width="7" 
        stroke-linejoin="round"
        filter="url(#perfectGlow)"/>

  <!-- ==================== İÇ D ÇEKİRDEĞİ ==================== -->
  <path d="M 88 78 
           L 114 78 
           A 32 32 0 0 1 114 142 
           L 88 142 
           Z" 
        fill="none" 
        stroke="url(#centeredDGrad)" 
        stroke-width="4" 
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Çip Çentiği (Notch) -->
  <circle class="logo-node" cx="96" cy="87" r="2.5"/>

  <!-- Tam Merkezdeki Çip Çekirdek Noktası (Visual Center Node) -->
  <circle class="logo-node" cx="110" cy="110" r="5" filter="url(#perfectGlow)"/>
</svg>
